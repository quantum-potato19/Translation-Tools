<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Translate FY</title>
  <link rel="stylesheet" href="/src/styles/popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <img src="/icons/logo.png" class="logo-icon" alt="logo">
        <span class="logo-text">Translate FY</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <button class="pdf-nav-btn" id="vocab-nav-btn" title="生词本与查词历史">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          <span>生词本</span>
        </button>
        <button class="pdf-nav-btn" id="pdf-nav-btn" title="打开 PDF 文档沉浸式对照翻译">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          <span>PDF 翻译</span>
        </button>
        <button class="settings-btn" id="settings-btn" title="设置">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </header>

    <!-- Native PDF Warning Overlay -->
    <div id="pdf-warning-card" class="result-card hidden" style="text-align: center; padding: 20px 16px; min-height: auto; background: rgba(255, 255, 255, 0.92);">
      <div style="color: #007AFF; margin-bottom: 10px; display: flex; justify-content: center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      </div>
      <h3 style="margin: 0 0 6px 0; font-size: 15px; font-weight: 600; color: #1c1c1e;">检测到 PDF 文档</h3>
      <p id="pdf-warning-desc" style="font-size: 12px; color: #636366; line-height: 1.4; margin: 0 0 14px 0;">当前正在 Chrome 原生浏览 PDF。是否使用 Translate FY 开启双语对照翻译与批注？</p>
      
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button id="open-pdf-btn" style="border: none; outline: none; padding: 9px 12px; border-radius: 9px; font-size: 13px; font-weight: 600; background: linear-gradient(135deg, #0A84FF, #5E5CE6); color: white; cursor: pointer; width: 100%; box-shadow: 0 4px 12px rgba(9, 132, 255, 0.2);">使用扩展打开并翻译 (当前页)</button>
        <button id="open-pdf-newtab-btn" style="border: 1px solid rgba(0, 122, 255, 0.25); outline: none; padding: 8px 12px; border-radius: 9px; font-size: 12.5px; font-weight: 500; background: rgba(0, 122, 255, 0.06); color: #007AFF; cursor: pointer; width: 100%;">在新标签页中打开</button>
        <button id="dismiss-pdf-card-btn" style="border: none; outline: none; padding: 6px; border-radius: 8px; font-size: 12px; color: #8e8e93; background: transparent; cursor: pointer; margin-top: 2px;">继续文本查词</button>
      </div>

      <!-- 本地文件权限未开启提醒 -->
      <div id="file-perm-hint" class="hidden" style="margin-top: 12px; padding: 8px 10px; border-radius: 8px; background: #fff3cd; color: #856404; font-size: 11.5px; text-align: left; line-height: 1.35;">
        <span>检测到本地文件。若需在扩展中打开，请在扩展管理页开启“允许访问文件网址”。</span>
        <button id="open-ext-manage-btn" style="margin-top: 6px; width: 100%; border: none; padding: 5px; border-radius: 6px; background: #ffeeba; color: #533f03; font-size: 11.5px; font-weight: 600; cursor: pointer;">前往开启权限</button>
      </div>
    </div>

    <!-- Main Workspace -->
    <main class="app-main" id="workspace-main">
      <div class="input-card">
        <textarea id="source-text" placeholder="输入要翻译的文本..." rows="3"></textarea>
        <button id="clear-btn" class="clear-btn hidden">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <!-- Controls Row -->
      <div class="controls-card">
        <select id="src-lang" class="ios-select">
          <option value="auto">自动检测</option>
          <option value="en">英语</option>
          <option value="zh-CN">简体中文</option>
          <option value="ja">日语</option>
          <option value="ko">韩语</option>
        </select>
        
        <button id="swap-lang-btn" class="swap-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M17 11l4-4-4-4M3 7h18M7 13l-4 4 4 4M21 17H3"/></svg>
        </button>

        <select id="tgt-lang" class="ios-select">
          <option value="zh-CN">简体中文</option>
          <option value="en">英语</option>
          <option value="ja">日语</option>
          <option value="ko">韩语</option>
        </select>

        <select id="engine-select" class="ios-select accent-select">
          <option value="google">Google</option>
        </select>
      </div>

      <!-- Model Select Row -->
      <div id="model-select-container" class="model-select-row hidden">
        <span class="model-select-label">模型版本:</span>
        <select id="model-select" class="ios-select model-select-input"></select>
      </div>

      <!-- Result Card -->
      <div class="result-card">
        <div class="result-header">
          <span class="engine-badge" id="current-engine-badge">Google</span>
          <div style="display: flex; align-items: center; gap: 4px;">
            <button id="speak-src-btn" class="icon-btn" title="朗读原文">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            </button>
            <button id="speak-res-btn" class="icon-btn" title="朗读译文">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
            </button>
            <button id="star-btn" class="icon-btn" title="加入生词本">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </button>
            <button id="copy-btn" class="icon-btn" title="复制译文">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
          </div>
        </div>
        <div class="result-content-wrapper">
          <div id="result-text" class="result-placeholder">翻译结果将在此显示...</div>
          <div id="loading-spinner" class="spinner hidden"></div>
        </div>
      </div>
    </main>

    <!-- Vocabulary Drawer / Overlay -->
    <div id="vocab-overlay" class="vocab-overlay hidden">
      <div class="vocab-header">
        <div style="display:flex; align-items:center; gap:6px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="#ff9500" stroke="#ff9500" stroke-width="1.5" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          <span style="font-size:14px; font-weight:600;">生词本 & 查词历史</span>
        </div>
        <button id="close-vocab-btn" class="close-btn" title="返回">✕</button>
      </div>

      <div class="vocab-search-row">
        <input type="text" id="vocab-search-input" placeholder="检索历史查词与生词..." class="vocab-search-input">
      </div>

      <div class="vocab-tabs">
        <button id="tab-vocab-all" class="vocab-tab active">全部 (<span id="count-all">0</span>)</button>
        <button id="tab-vocab-starred" class="vocab-tab">★ 收藏 (<span id="count-starred">0</span>)</button>
      </div>

      <div id="vocab-list" class="vocab-list">
        <!-- 动态渲染生词条目 -->
      </div>

      <div class="vocab-footer">
        <button id="export-vocab-md-btn" class="vocab-action-btn" title="导出为 Markdown 文档">Markdown</button>
        <button id="export-vocab-csv-btn" class="vocab-action-btn" title="导出为 CSV 表格">CSV</button>
        <button id="clear-unstarred-btn" class="vocab-action-btn danger" title="仅清理未收藏的历史记录">清理未收藏</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/popup.js"></script>
</body>
</html>
